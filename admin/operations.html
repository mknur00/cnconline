<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNC Online | Operations</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#1e293b;font:15px system-ui,Arial}header{background:#102b3a;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}a{color:#087eac}header a{color:white}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:28px}h2{font-size:19px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}button{cursor:pointer;border:0;background:#ec771a;color:white;padding:11px 15px;border-radius:7px;font-weight:650}button.secondary{background:#0a789f}button:disabled{opacity:.5}section{background:white;border:1px solid #dae1e8;border-radius:12px;padding:20px;margin:15px 0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e7edf2;text-align:left}select,input{padding:10px;border:1px solid #c8d4dc;border-radius:6px;max-width:100%}.scroll{overflow-x:auto}.muted{color:#5c6c79}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{background:#f1f7fa;padding:16px;border-radius:8px}.metric b{display:block;font-size:21px}.message{padding:12px;border-radius:7px;background:#fff3e5;white-space:pre-wrap}label{display:block;margin:8px 0}label input{display:block;width:100%}@media(max-width:600px){main{padding:12px}section{padding:14px}header{padding:16px}}</style></head><body><header><strong>CNC ONLINE · Operations</strong><a href="/admin">Back to administration</a></header><main><h1>Order & workshop control</h1><p class="muted">Staff-only tools. Prices in GBP, with no VAT added to invoice totals. Review every draft invoice before issuing.</p><div id="message" class="message" role="status">Loading…</div><nav><button data-view="production">Production</button><button data-view="orders">Orders</button><button data-view="stock">Stock</button><button data-view="invoices">Invoices</button><button data-view="reports">Reports</button></nav><div id="content"></div></main><script>
const $=s=>document.querySelector(s), money=p=>'£'+(Number(p||0)/100).toFixed(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts){const r=await fetch(url,{credentials:'same-origin',...opts});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
const post=(url,data)=>api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
const notify=s=>$('#message').textContent=s;
const views={};
views.production=async()=>{const d=await api('/api/production/board');$('#content').innerHTML='<section><h2>Workshop production board</h2><p class="muted">Select the next stage. Changes are recorded in production history.</p><div class="scroll"><table><thead><tr><th>Customer</th><th>Quote</th><th>Job</th><th>Stage</th><th>Due</th><th>Update</th></tr></thead><tbody>'+d.jobs.map(j=>'<tr><td>'+esc(j.customer_name)+'</td><td>'+esc(j.quote_number)+'</td><td>'+esc(j.id)+'</td><td>'+esc(j.current_stage||j.status)+'</td><td>'+esc(j.due_date||'—')+'</td><td><select data-stage="'+esc(j.id)+'">'+['cutting','cnc','edgebanding','quality_check','ready','dispatched','completed','on_hold'].map(x=>'<option>'+x+'</option>').join('')+'</select> <button data-save-stage="'+esc(j.id)+'">Save</button></td></tr>').join('')+'</tbody></table></div></section>';document.querySelectorAll('[data-save-stage]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.saveStage;await post('/api/jobs/'+id+'/stage',{stage:document.querySelector('[data-stage="'+id+'"]').value});notify('Stage recorded');await views.production()}catch(e){notify(e.message)}})};
views.orders=async()=>{const d=await api('/api/jobs');$('#content').innerHTML='<section><h2>Customer orders</h2><p class="muted">Orders are created from accepted, priced quotations in the main administration area. Converted quotations retain a separate order snapshot.</p><div class="scroll"><table><thead><tr><th>Customer</th><th>Quote</th><th>Status</th><th>Due date</th></tr></thead><tbody>'+d.jobs.map(j=>'<tr><td>'+esc(j.customer_name)+'</td><td>'+esc(j.quote_number)+'</td><td>'+esc(j.status)+'</td><td>'+esc(j.due_date||'—')+'</td></tr>').join('')+'</tbody></table></div></section>'};
views.stock=async()=>{const d=await api('/api/stock');$('#content').innerHTML='<section><h2>Sheet stock</h2><p class="muted">Adjustments require manager access and are logged. Automatic reservations are not enabled.</p><div class="scroll"><table><tr><th>Material</th><th>Thickness</th><th>Sheet</th><th>On hand</th><th>Reorder at</th><th>Adjust</th></tr>'+d.stock.map(x=>'<tr><td>'+esc(x.material_name)+'</td><td>'+esc(x.thickness_mm)+' mm</td><td>'+esc(x.sheet_length_mm)+' × '+esc(x.sheet_width_mm)+'</td><td>'+esc(x.sheets_on_hand)+'</td><td>'+esc(x.reorder_level)+'</td><td><input type="number" style="width:75px" placeholder="+/-" data-qty="'+esc(x.id)+'"> <button data-stock="'+esc(x.id)+'">Apply</button></td></tr>').join('')+'</table></div></section><section><h2>Add material stock</h2><form id="new-stock" class="grid"><label>Material<input name="material_name" required></label><label>Thickness (mm)<input type="number" step=".01" min=".01" name="thickness_mm" required></label><label>Sheet length (mm)<input type="number" min="100" name="sheet_length_mm" required></label><label>Sheet width (mm)<input type="number" min="100" name="sheet_width_mm" required></label><label>Reorder threshold<input type="number" min="0" name="reorder_level" value="0"></label><button type="submit">Save stock item</button></form></section>';document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.stock;const quantity_change=Number(document.querySelector('[data-qty="'+id+'"]').value);const reason=prompt('Reason for stock adjustment');if(reason===null)return;await post('/api/stock/'+id+'/movements',{quantity_change,reason});notify('Stock movement recorded');await views.stock()}catch(e){notify(e.message)}});$('#new-stock').onsubmit=async e=>{e.preventDefault();try{await post('/api/stock',Object.fromEntries(new FormData(e.target)));notify('Stock item saved');await views.stock()}catch(err){notify(err.message)}}};
views.invoices=async()=>{const [d,j]=await Promise.all([api('/api/invoices'),api('/api/jobs')]);$('#content').innerHTML='<section><h2>Invoices & payments</h2><p class="muted">Invoices use the accepted order total. No VAT is added. Invoice issue and payment recording require manager permissions.</p><form id="new-invoice"><select name="job_id" required><option value="">Select an order</option>'+j.jobs.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.customer_name)+' · '+esc(x.quote_number)+'</option>').join('')+'</select> <button>Create draft invoice</button></form><div class="scroll"><table><tr><th>Invoice</th><th>Customer</th><th>Status</th><th>Total</th><th>Paid</th><th>Action</th></tr>'+d.invoices.map(x=>'<tr><td>#'+esc(x.invoice_number)+'</td><td>'+esc(x.customer_name)+'</td><td>'+esc(x.status)+'</td><td>'+money(x.amount_pence)+'</td><td>'+money(x.paid_pence)+'</td><td>'+(x.status==='draft'?'<button data-issue="'+esc(x.id)+'">Issue</button>':x.status==='issued'?'<button data-pay="'+esc(x.id)+'">Record payment</button>':'—')+'</td></tr>').join('')+'</table></div></section>';$('#new-invoice').onsubmit=async e=>{e.preventDefault();try{await post('/api/invoices',{job_id:new FormData(e.target).get('job_id')});notify('Draft invoice created');await views.invoices()}catch(err){notify(err.message)}};document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=async()=>{if(!confirm('Issue this invoice? Check details first.'))return;try{await post('/api/invoices/'+b.dataset.issue+'/issue',{});notify('Invoice issued');await views.invoices()}catch(e){notify(e.message)}});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{const amount=prompt('Payment amount in GBP');if(amount===null)return;const reference=prompt('Payment reference');if(reference===null)return;const p=Math.round(Number(amount)*100);if(!Number.isSafeInteger(p)||p<=0)return notify('Invalid payment amount');try{await post('/api/invoices/'+b.dataset.pay+'/payments',{amount_pence:p,reference});notify('Payment recorded');await views.invoices()}catch(e){notify(e.message)}})};
views.reports=async()=>{const d=await api('/api/reports/operations');const group=(title,rows)=>'<section><h2>'+title+'</h2><div class="grid">'+rows.map(x=>'<div class="metric">'+esc(x.status)+'<b>'+esc(x.count)+'</b>'+(x.total_pence!==undefined?money(x.total_pence):'')+'</div>').join('')+'</div></section>';$('#content').innerHTML=group('Quotation pipeline',d.quotes)+group('Production orders',d.jobs)+group('Invoices',d.invoices)+'<p class="muted">'+esc(d.notice)+'</p>'};
async function show(name){notify('Loading '+name+'…');try{await views[name]();notify('Loaded '+name)}catch(e){notify('Unable to load: '+e.message);$('#content').innerHTML='<section>Sign in through <a href="/admin">administration</a> and check your permissions.</section>'}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));show('production');
</script></body></html>
