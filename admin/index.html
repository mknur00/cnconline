<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNC ONLINE | Admin</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f3f6fa;color:#1d2934}header{background:#087eac;color:white;padding:22px 5%}header b{font-size:22px}main{max-width:1000px;margin:42px auto;padding:0 20px}.panel{background:white;border:1px solid #dce5ed;border-radius:12px;padding:28px;box-shadow:0 4px 16px #102a4310}input{display:block;width:100%;padding:13px;margin:8px 0 16px;border:1px solid #b9c9d6;border-radius:7px;font-size:16px}button{background:#f57a13;color:white;border:0;padding:13px 24px;border-radius:7px;cursor:pointer;font-weight:700}button.secondary{background:#087eac}label{font-weight:600}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin:20px 0}.stat{background:#eff7fc;border-radius:9px;padding:24px}.stat strong{display:block;font-size:32px;color:#087eac}.muted{color:#5d6c7a}.error{color:#b32c24}#message{min-height:24px}</style></head><body><header><b>CNC ONLINE</b> · Administration</header><main><section id="login" class="panel"><h1>Staff login</h1><p class="muted">Sign in to manage CNC ONLINE customers, quotations and jobs.</p><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required value="mknur00@gmail.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="message" class="error" role="alert"></p></section><section id="dashboard" class="panel hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1>Admin dashboard</h1><button id="logout" class="secondary">Sign out</button></div><p id="welcome"></p><div class="stats"><div class="stat">Customers<strong id="customers">—</strong></div><div class="stat">Quotations<strong id="quotes">—</strong></div><div class="stat">Workshop jobs<strong id="jobs">—</strong></div></div><p class="muted">Customer management and quotation editing will be enabled in the next development stage.</p></section></main><script>async function api(url,options){const r=await fetch(url,{credentials:'same-origin',...options});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}async function showDashboard(){try{const d=await api('/api/dashboard');document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');document.getElementById('welcome').textContent='Signed in as '+d.user.email+' ('+d.user.role.replaceAll('_',' ')+')';for(const key of ['customers','quotes','jobs'])document.getElementById(key).textContent=d[key];}catch{document.getElementById('login').classList.remove('hidden');document.getElementById('dashboard').classList.add('hidden');}}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.target);try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))});document.getElementById('message').textContent='';await showDashboard();}catch(err){document.getElementById('message').textContent=err.message;}});document.getElementById('logout').addEventListener('click',async()=>{await api('/api/auth/logout',{method:'POST'});location.reload();});showDashboard();</script></body></html>
