name: Unpack CNC ONLINE website
on:
  push:
    paths:
      - 'CNCONLINE-GITHUB-UPLOAD-FILES.zip'
      - '.github/workflows/unpack-website.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract website
        run: |
          unzip -o CNCONLINE-GITHUB-UPLOAD-FILES.zip -d .
          test -f index.html
          test -f order.html
          test -f approved-homepage.png
          rm CNCONLINE-GITHUB-UPLOAD-FILES.zip
          cat > railway.json <<'EOF'
          {
            "$schema": "https://railway.com/railway.schema.json",
            "build": {"builder": "RAILPACK"},
            "deploy": {"startCommand": "python3 -m http.server $PORT --bind 0.0.0.0", "restartPolicyType": "ON_FAILURE"}
          }
          EOF
      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract CNC ONLINE website for Railway"
          git push
